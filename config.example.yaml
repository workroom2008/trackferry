# 可选的配置文件，放在 data/config.yaml。
# 用 compose.yaml 里的环境变量就够了；两边都写时，环境变量优先。

# 监听地址
listen: ":18561"

# 音箱取歌用的局域网地址（TRACKFERRY_URL）
public_base_url: "http://192.168.1.10:18561"

# 允许设为接管的音箱，写名字的一部分，"*" 为全部（TRACKFERRY_TAKEOVER）
takeover_speakers: ["*"]

# 去 GitHub 看有没有新版本（TRACKFERRY_UPDATE_CHECK）
update_check: true

# 自己部署的洛雪音乐：填了就和其他平台一起找歌（TRACKFERRY_LX_URL 等）
# lx:
#   url: "http://192.168.1.10:9527/rest"
#   user: "admin"
#   password: ""

# 容器内的目录，一般不用改
data_dir: /data
music_dir: /music
